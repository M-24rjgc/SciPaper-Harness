# spark-to-paper: one idea, a proposal, or a proposal with measured results
# in; a complete compiled paper out. Routes follow the upstream orchestrator's
# Stage 0: an idea gets a story first; a proposal leaves result cells "--"
# until experiments fill them; measured data means every number traces to it.
# The gates are the upstream linters, run unchanged through gates/run_gate.py;
# see NOTICE.md for the upstream commit and what was adapted.
id: spark-to-paper
order: 10
name:
  en: spark-to-paper
  zh: spark-to-paper
summary:
  en: An idea, a proposal, or a proposal with measured results in; a complete compiled paper out — real citations, editable vector figures, every number traced.
  zh: 输入一个想法、一份提案，或带实测结果的提案，产出一篇编译好的完整论文：引用真实、图是可编辑矢量图、每个数字可追溯。
source:
  repo: https://github.com/Spark-To-Paper-Skills/spark-to-paper-skills
  version: 1.2.0
  license: MIT
entry: ts-paper
routes:
  - id: idea
    name: { en: From an idea, zh: 从想法开始 }
    summary:
      en: A line or a short note; the research story is built first.
      zh: 一句话或一小段笔记，先把研究故事搭起来。
  - id: proposal
    name: { en: From a proposal, zh: 从提案开始 }
    summary:
      en: Problem, method and evaluation are set but nothing is measured; result cells stay "--" until the experiments run.
      zh: 问题、方法、评测都已定，但还没有实测结果；结果格先留「--」，跑完实验再填。
  - id: data
    name: { en: From measured results, zh: 从实测结果开始 }
    summary:
      en: Results already exist; every number in the paper traces to them.
      zh: 结果已经有了，论文里的每个数字都追溯到这些结果。
defaultRoute: proposal
phases:
  - id: story
    label: { en: Story, zh: 研究故事 }
    routes: [idea]
    skills: [ts-idea2story, ts-kg-build]
    checks: [story-lint]
    requires:
      - when: { file: story.json }
        message: Build the 8-field story from the idea and write story.json (ts-idea2story)
  - id: data
    label: { en: Data, zh: 数据 }
    routes: [data]
    skills: [ts-paper-data, results-ingest]
    requires:
      - when: dataEvidence
        message: Import the measured results as data evidence (research_evidence import)
      - when: { file: results.facts.json }
        message: Write results.facts.json — the real numbers, produced by a script from the data — and import it as data evidence
  - id: plan
    label: { en: Plan, zh: 规划 }
    skills: [ts-paper-plan]
    checks: [template-lint, blueprint-lint]
    requires:
      - when: { file: blueprint.json }
        message: Write blueprint.json against the venue's template.json (ts-paper-plan)
  - id: cite
    label: { en: Citations, zh: 引用 }
    skills: [ts-paper-cite]
    checks: [citations-bib]
    requires:
      - when: { file: refs.bib }
        message: Build refs.bib from verified literature, with claims_map.json (ts-paper-cite)
  - id: write
    label: { en: Write, zh: 写作 }
    skills: [ts-paper-write]
    checks: [draft-lint, citations-lint]
    requires:
      - when: { file: "sections/*.tex", min: 3 }
        message: Write every section as sections/<id>.tex, plus sections/abstract.tex (ts-paper-write)
  - id: refine
    label: { en: Refine, zh: 润色 }
    skills: [ts-paper-refine]
    checks: [draft-lint, citations-lint]
    requires:
      - when: { file: logs/4_refine.io.md }
        message: Run the refine pass (right-size, de-AI, logic self-check) and log it in logs/4_refine.io.md
  - id: review
    label: { en: Review, zh: 评审 }
    skills: [ts-paper-review]
    checks: [review]
    requires:
      - when: reviewCurrent
        message: No current review — run the adversarial review panel and write reviews/review.md
      - when: { file: logs/5_review.io.md }
        message: Log the review round in logs/5_review.io.md (tier, issues found, closed, left for the author)
  - id: figures
    label: { en: Figures, zh: 图表 }
    skills: [ts-paper-figure, ts-figure-svg, ts-paper-data]
    checks: [vector-figures, figure-critique, figures]
    requires:
      - when: { file: figures/figures.manifest.json }
        message: Draw every planned figure and record it in figures/figures.manifest.json (ts-paper-figure)
  - id: latex
    label: { en: LaTeX, zh: 编译排版 }
    skills: [ts-paper-latex, latex-compile-and-fix, visual-self-review]
    checks: [compile, visual, cite, structure]
    requires:
      - when: { file: main.tex }
        message: Assemble main.tex (research_artifact run-script assemble-paper), then compile it
      - when: pagesInspected
  - id: experiments
    label: { en: Experiments, zh: 实验 }
    routes: [idea, proposal]
    checkpoint: true
    skills: [ts-paper-experiment, running-experiments]
    checks: [placeholders, numbers, draft-lint, compile]
    requires:
      - when: resultsOrData
        message: Run the feasible experiments and collect them (research_experiment), or import the author's results
      - when: noActiveRuns
      - when: { file: results.facts.json }
        message: Write results.facts.json from the collected results with a script, import it, and set results_mode to data_aware in template.json
  - id: submission
    label: { en: Submission, zh: 投稿 }
    skills: [submission-package]
    checks: all
    requires:
      - when: reviewCurrent
      - when: pagesInspected
gates:
  - id: story-lint
    script: gates/run_gate.py
    args: [story, --root, "{root}"]
    routes: [idea]
  - id: template-lint
    script: gates/run_gate.py
    args: [template, --root, "{root}"]
  - id: blueprint-lint
    script: gates/run_gate.py
    args: [blueprint, --root, "{root}"]
  - id: citations-bib
    script: gates/run_gate.py
    args: [citations, --root, "{root}", --stage, cite]
  - id: citations-lint
    script: gates/run_gate.py
    args: [citations, --root, "{root}"]
  - id: draft-lint
    script: gates/run_gate.py
    args: [draft, --root, "{root}"]
  - id: vector-figures
    script: gates/run_gate.py
    args: [vector, --root, "{root}"]
  - id: figure-critique
    script: gates/run_gate.py
    args: [critique, --root, "{root}"]
scripts:
  - id: blueprint-fix
    script: upstream/ts-paper-plan/scripts/blueprint_lint.py
    args: ["{root}", --fix]
    description: Repair blueprint.json in place where the upstream linter can (citation-type aliases, missing template sections, word-band shape) and report what is left
  - id: assemble-paper
    script: upstream/ts-paper-latex/scripts/assemble_paper.py
    args: ["{root}", --no-compile]
    description: Build main.tex from template.json, blueprint.json and sections/*.tex (canonical headings, caption placement, cite merging, table width); compile it afterwards with research_artifact compile
  - id: reflow-sections
    script: upstream/ts-paper-write/scripts/reflow_tex.py
    args: ["{root}"]
    description: Normalize every sections/*.tex to one line per paragraph (PDF-neutral)
  - id: plot-results
    script: upstream/ts-paper-data/scripts/plot_results.py
    timeoutSeconds: 300
    description: "Run a matplotlib script in the house style and save a PNG and a vector PDF (args: --script code/plot_x.py --out figures/x.png)"
  - id: consistency-check
    script: upstream/ts-paper-experiment/scripts/consistency_check.py
    description: "List risky wording (significant, robust, generalize, prove…) in a .tex file (args: the file)"
  - id: recompute-results
    script: upstream/ts-paper-experiment/scripts/check_result_recomputation.py
    routes: [idea, proposal]
    description: Tabulate every metric file under .research/runs, outputs and workspace/experiments (mean, std, seeds) into outputs/reports/RESULT_RECOMPUTATION_CHECK.md
  - id: scan-code
    script: upstream/ts-paper-experiment/scripts/check_code_paper_consistency.py
    routes: [idea, proposal]
    description: List which reproducibility artifacts (preprocessing, models, baselines, training, evaluation, plotting, config) code/ holds, into outputs/reports/CODE_PAPER_CONSISTENCY_SCAN.md
