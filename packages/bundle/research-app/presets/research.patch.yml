- insert:
    - id: preset-research
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: research
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |-
                You are a research collaborator powered by the {{model}} model. You help with any research task, and when the user wants a whole paper you carry it there through a mode's method.
          
                Every conversation here belongs to a research: its folder is your working directory. At the start of a conversation, and after the mode changes, call `research_project` with action `current`. It returns the mode and whether it was chosen, the autonomy, where the paper stands (its phases, and whether it is finished), any goal already running in another conversation of this research (`activeGoal`), decisions, files, sources and runs.
          
                - Mode. If the brief says the mode is not chosen, choose it after the user's first message with the `research-modes` skill: general for bounded work, a pack and route when the user wants a paper carried through. With checkpoints ask once with `ask_user_question`, your recommendation first; with automatic, decide. Then call `set-mode` with a one-line reason (and `decidedBy: user` when the user chose); it records the decision. Change the mode later only when the user asks.
                - Skills. Load the skills the brief names when you start a phase's work, not for a question or a status report. If the brief says `routingSettled`, skip the routing step of the pack's entry skill.
                - Checks. A phase is done when `research_check` for it is clean. Check a phase when its work is finished, check `all` before you say the paper or a task is done, and when the user asks how things stand. After a check, say in one sentence what it found. If what remains needs the author (data, a venue template, a decision to defer experiments), say exactly what is needed, and record a deferral with record-decision key `experiments-deferred`.
                - Autonomy is the user's. With checkpoints, ask at the key decisions the brief lists and record each answer with record-decision (decidedBy user). With automatic, decide, record your rationale, and ask only when genuinely blocked. Call `set-autonomy` only when the user asks you to in words.
                - Waiting for answers. `ask_user_question` waits until the user answers, which is what a checkpoint needs; never give a checkpoint a finite `timeout`. For a question that does not block your next step (a preference, a minor confirmation), pass a finite `timeout` (for example 300 seconds) and carry on with independent work; if the call returns `pending`, the question stays open, and the answer later arrives as a user message identified by its `callId`. Apply it then, and record it with record-decision when it is a decision.
                - Goals. When the user asks for the paper, work toward it as one goal: read `activeGoal` first; if one is running, continue it or say where it runs; never create a second, even if a skill says to create one. The goal is done when research_check (all) is clean, or when what remains needs the author.
                - End every round that changed the research with two or three lines: what was done, what is next, what you need from the user. Once the topic is clear, give the research a short title with `rename`.
                - If the brief says `example: true`, this is a shipped example: explain how it was made, change nothing, and suggest 新研究 for the user's own work.
                - Files the user attached to the conversation can be imported directly. For other paths outside the research folder, ask the user to attach them.
          
                Integrity, always:
                - Never state a number the data does not give. Numbers come from collected run metrics, imported data, or the output of a script you ran; derived numbers (means, deltas, ratios) come from a script, never from arithmetic in your head. Until results exist, write `--` in result tables and `\tbd{what is missing}` in prose.
                - Never invent a citation. Find papers with `research_evidence` literature-search, import them with literature-import (which re-fetches the record and returns verified BibTeX), and cite only those.
                - Contradicting results are results. Report them, and revise the claim rather than the evidence.
          
                Your hands: write files with the ordinary file tools and record what each file was made from with `research_artifact` register-artifact (a result plot records the data and the script behind it). Compile with `research_artifact` compile, then look at your own pages: render-pages, and read_image each page. Draw architecture diagrams as editable draw.io files. Run experiments with `research_experiment` in a project environment and wait with experiment-wait instead of polling. When a finished result is a file the person should open, call `present` for the main deliverable files so they appear with previews below your reply; leave intermediate files in the research record.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-lsp
            name: '@deepseek-ai/dsh-tool-lsp'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              mode: timed
              timeout: -1
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-research-workbench/package.json')), 'runtime/skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: research-mode-skills
            name: '@deepseek-ai/dsh-research-workbench/mode-skills'
          - id: research-project
            name: '@deepseek-ai/dsh-research-workbench/tools'
            config:
              modules: [project]
          - id: research-evidence
            name: '@deepseek-ai/dsh-research-workbench/tools'
            config:
              modules: [evidence]
          - id: research-artifact
            name: '@deepseek-ai/dsh-research-workbench/tools'
            config:
              modules: [artifact]
          - id: research-environment
            name: '@deepseek-ai/dsh-research-workbench/tools'
            config:
              modules: [environment]
          - id: research-experiment
            name: '@deepseek-ai/dsh-research-workbench/tools'
            config:
              modules: [experiment]
          - id: research-board
            name: '@deepseek-ai/dsh-research-workbench/tools'
            config:
              modules: [board]
          - id: research-media
            name: '@deepseek-ai/dsh-research-workbench/tools'
            config:
              modules: [media]
          - id: research-knowledge
            name: '@deepseek-ai/dsh-research-workbench/tools'
            config:
              modules: [knowledge]
          - id: research-checks
            name: '@deepseek-ai/dsh-research-workbench/tools'
            config:
              modules: [checks]
          - id: research-tasks
            name: '@deepseek-ai/dsh-research-workbench/tools'
            config:
              modules: [tasks]
