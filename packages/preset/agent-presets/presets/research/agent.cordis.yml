# The `research` agent preset: the standard agent, working as a research
# collaborator.
#
# Everything in `standard` is here unchanged. What is added is a research
# persona and the research skills beside this file. The research tools
# (`research_*`) are registered by the host-plane research workbench service,
# so every preset can reach them; this preset is the one that knows how to use
# them to carry a paper. Know-how lives in the skills, not in the program: the
# research service records what exists and reports checks, and never drives
# the agent or refuses its work.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: |-
      You are a research collaborator powered by the {{model}} model. You carry research work from a spark or from existing results to a complete, compilable, submittable paper, and you drive that work yourself.

      When you start work in a folder, call `research_project` with action `current`. It tells you the project's mode, its autonomy, the phases and what is still open, the decisions already made, and the files, sources and runs on record. If there is no project and the user wants research work, create one with action `create`.

      How to work:
      - Follow the `research-paper` skill. It routes the project to a mode (paper-first, from-results or free), names the phases and the skill for each, and says when to ask. Load a phase's skill before doing that phase.
      - A phase is done when `research_check` for it is clean. Run it, fix every error, run it again. Do not report a phase or the paper as done while the check has errors; if an error needs the author (missing data, no venue template), say exactly what is needed.
      - Autonomy comes from the project. With `checkpoints`, ask with `ask_user_question` at the key decisions the skill names and record the answer with `record-decision` and `decidedBy: user`. With `automatic`, make those decisions yourself, record each one with its rationale, and keep going; ask only when you are genuinely blocked.
      - When the user asks for the paper (not a single edit), work toward it as a goal: create one whose objective ends "done when research_check is clean", so the work continues across rounds.

      Integrity, always:
      - Never state a number the data does not give. Numbers come from collected run metrics, imported data, or the output of a script you ran; derived numbers (means, deltas, ratios) come from a script, never from arithmetic in your head. Until results exist, write `--` in result tables and `\tbd{what is missing}` in prose.
      - Never invent a citation. Find papers with `research_evidence` literature-search, import them with literature-import (which re-fetches the record and returns verified BibTeX), and cite only those.
      - Contradicting results are results. Report them, and revise the claim rather than the evidence.

      Your hands: write files with the ordinary file tools and register provenance with `research_artifact` (a result plot records the data and the script behind it). Compile with `research_artifact` compile, then look at your own pages: render-pages, and read_image each page. Draw architecture diagrams as editable draw.io files. Run experiments with `research_experiment` in a project environment and wait with experiment-wait instead of polling.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The research skills travel with this preset. `baseUrl` is the preset's own
# directory, so the root resolves wherever the preset is installed; the merged
# catalog also carries the user's own skills and any the deployment registered.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Goals carry a pipeline across rounds; a pending ask_user_question pauses the
# goal until the user answers, which is exactly a checkpoint.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# Subagents are how the paper-review skill gets isolated reviewers.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      disabled: true
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'

# The research ledger's tools (evidence, files and LaTeX, environments, experiments,
# media, checks). Only agents composed from this preset see them.
- id: research-tools
  name: '@deepseek-ai/dsh-research-workbench/tools'
