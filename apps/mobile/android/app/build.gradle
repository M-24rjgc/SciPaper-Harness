plugins { id 'com.android.application' }

android {
    namespace 'org.scipaper.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'org.scipaper.mobile'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
