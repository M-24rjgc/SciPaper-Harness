name: Bounded scientific retrieval quality
on:
  push:
    branches: ['spike/embeddinggemma2-runtime']
    paths:
      - '.github/workflows/embedding-quality-evaluation.yml'
      - 'scripts/embedding-quality-evaluation/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: embedding-quality-evaluation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scifact-candidate-challenge:
    name: SciFact 32-query 512-candidate challenge / Linux CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      EVALUATION_ROOT: scripts/embedding-quality-evaluation
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify frozen evaluation bundle and metric unit tests
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['EVALUATION_ROOT'])
          for name, expected in json.loads((root/'evaluation-files.json').read_text()).items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == expected, name
          for name, expected in json.loads((root/'product-contracts.json').read_text()).items():
              assert hashlib.sha256((root/'product'/name).read_bytes()).hexdigest() == expected, name
          print('Frozen evaluation and unchanged product contracts verified')
          PY
          python -m unittest discover -s "$EVALUATION_ROOT" -p 'test_*.py' -v
      - name: Install only exact pinned Linux native wheel into isolated runtime
        run: |
          printf '%s\n' 'litert-lm-api @ https://files.pythonhosted.org/packages/c9/8f/eb7a5203be1d48440c6b8d6e6382c3f744dd6d338fe400555718b4d695a1/litert_lm_api-0.18.0-py3-none-manylinux_2_27_x86_64.whl --hash=sha256:b64e2cf6d7dcb90ff094b74af595cc5d53faa07e0889f967d15df8d3e696b53c' > "$RUNNER_TEMP/quality-runtime-requirements.txt"
          python -m pip install --only-binary=:all: --no-deps --no-compile --require-hashes --target "$RUNNER_TEMP/quality-runtime" -r "$RUNNER_TEMP/quality-runtime-requirements.txt"
      - name: Download and size/hash verify frozen public text model
        run: |
          python "$EVALUATION_ROOT/prepare_model.py" --manifest "$EVALUATION_ROOT/product/packages/llm/embedding-litert-lm/runtime/assets.json" --output "$RUNNER_TEMP/quality-model"
      - name: Evaluate frozen real human-labelled scientific candidate challenge
        run: |
          mkdir -p quality-results
          python - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          Path('quality-results/execution.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'run': 'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
              'baseSpikeCommit': '53fcc430d95a9127892009a9ef3f960322f94a5c',
              'node': subprocess.check_output(['node','--version'],text=True).strip(),
              'python': platform.python_version(),
              'scope': 'Fixed enriched 32-query/512-document candidate challenge; not official or full-corpus SciFact/BEIR'
          },indent=2)+'\n')
          PY
          python "$EVALUATION_ROOT/evaluate.py" \
            --product-root "$EVALUATION_ROOT/product" \
            --runtime "$RUNNER_TEMP/quality-runtime" \
            --model "$RUNNER_TEMP/quality-model/embeddinggemma-2-text-270m.litertlm" \
            --work "$RUNNER_TEMP/scifact-work" \
            --output quality-results
      - name: Retain only ID-based quality measurements and hardware provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scifact-bounded-quality-linux
          path: quality-results/
          if-no-files-found: warn
          retention-days: 14
