name: SciPaper CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  DSH_GATE_CONCURRENCY: '2'

jobs:
  static:
    name: Repository static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run repository static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: pnpm run check:ci:static

  research:
    name: Research / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build research product
        run: pnpm run build:research
      - name: Research, plugin lifecycle and desktop regressions
        run: >-
          pnpm exec vitest run --maxWorkers=2
          packages/research/workbench
          packages/bundle/research-app
          packages/bundle/research-knowledge-bundle
          packages/client/ui-research
          apps/desktop/tests/project-manager.spec.ts
          scripts/ci-workflow.spec.ts
          scripts/ci-compatible-selfhosted.spec.ts
          scripts/verify-default-product-isolation.spec.ts
          scripts/check-workspace-constraints.spec.ts
