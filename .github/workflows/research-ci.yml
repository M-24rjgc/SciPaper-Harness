name: SciPaper CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  DSH_GATE_CONCURRENCY: '2'

jobs:
  static:
    name: Repository static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run repository static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: pnpm run check:ci:static

  research:
    name: Research / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build research product
        run: pnpm run build:research
      - name: Research, harness lifecycle and desktop regressions
        run: >-
          pnpm exec vitest run --maxWorkers=2 --testTimeout=30000 --hookTimeout=30000
          packages/research/workbench
          packages/bundle/research-app
          packages/bundle/research-knowledge-bundle
          packages/client/ui-research
          packages/api/job-controller
          packages/api/workspace-controller
          packages/client/ui-jobs
          packages/jobs
          packages/shell/bash-local
          packages/shell/pwsh-local
          packages/shell/tool-bash
          packages/shell/tool-pwsh
          packages/sandbox/sandbox-local
          packages/sandbox/sandbox-windows-acl
          packages/session-query/session-log-export
          packages/ssh/ssh
          packages/ssh/remote-workspace-presets
          packages/web
          packages/api/gateway
          packages/api/workspace-files
          packages/client/connection
          packages/client/hmr
          packages/client/ui-sidebar-documentpreview
          packages/mcp/mcp-client
          packages/attachment/attachment-local
          packages/util/http-proxy
          apps/desktop/tests
          scripts/ci-workflow.spec.ts
          scripts/ci-compatible-selfhosted.spec.ts
          scripts/verify-default-product-isolation.spec.ts
          scripts/check-workspace-constraints.spec.ts
          scripts/security-dependency-patches.spec.ts
          scripts/dev-web.spec.ts
