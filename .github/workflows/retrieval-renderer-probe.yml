name: Bounded PDF renderer native probe
on:
  push:
    branches: ['spike/embeddinggemma2-runtime']
    paths:
      - '.github/workflows/retrieval-renderer-probe.yml'
      - 'scripts/retrieval-renderer-probe/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retrieval-renderer-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  renderer:
    name: Bounded PDF pages / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'
      - name: Install reviewed hash-locked renderer wheels only
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r scripts/retrieval-renderer-probe/requirements.txt
      - name: Exercise the exact product renderer and OS memory cap
        env:
          RENDERER_PROBE_DIR: ${{ runner.temp }}/retrieval-renderer-probe
        run: python scripts/retrieval-renderer-probe/probe.py
      - name: Retain bounded synthetic measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-renderer-${{ matrix.os }}
          path: ${{ runner.temp }}/retrieval-renderer-probe/renderer-result.json
          if-no-files-found: warn
